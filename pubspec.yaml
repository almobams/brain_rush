name: brain_rush
description: A polished, offline 60-second brain-training game.
publish_to: none
version: 1.0.0+4
environment:
  sdk: ^3.13.3
dependencies:
  cupertino_icons: ^1.0.9
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  # 9.1.0 exposes beta preloader headers that fail iOS framework module checks.
  # Keep the published 9.0.0 release until a compatible upstream fix is released.
  google_mobile_ads: 9.0.0
  in_app_purchase: ^3.3.1
  shared_preferences: ^2.5.5
  share_plus: ^13.3.1
  flutter_local_notifications: ^22.3.1
  flutter_timezone: ^5.1.0
  timezone: ^0.11.1
  supabase_flutter: ^2.18.0
  url_launcher: ^6.3.2
  package_info_plus: ^10.2.1
  device_info_plus: ^13.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
